name: Offline regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Run offline regression suite
        run: python scripts/run_ci_tests.py

  ubuntu-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MUJOCO_GL: osmesa
      UGRP_SESSION_DIR: ${{ runner.temp }}/ugrp-quickstart-sessions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-sim.txt
            requirements-test.txt

      - name: Install Ubuntu rendering and recording tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6 libgl1 libglfw3 ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -encoders | grep libx264

      - name: Install simulator dependencies
        run: |
          python -m pip install -r requirements-sim.txt -r requirements-test.txt
          python -m pip check

      - name: Check demo input and output boundaries
        run: python -m pytest -q tests/test_sim_quickstart.py

      - name: Render and move without a model or GPU
        run: |
          python scripts/ugrp_session.py run quickstart -- python -m scripts.sim_quickstart --output outputs/quickstart-ci
          test ! -e "$UGRP_SESSION_DIR/quickstart.json"

      - name: Keep demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-quickstart
          path: outputs/quickstart-ci/
          if-no-files-found: warn
          retention-days: 14
