<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1119">
  <title>MasterPi Control</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow">CONTROL FOUNDATION</p><h1>MasterPi Control</h1><p class="muted">연결과 명령 전달을 확인하는 최소 제어판</p></div>
    <div id="connection" class="connection checking" role="status" aria-live="polite"><span class="dot"></span><div><strong id="connection-label">확인 중</strong><small id="connection-detail">Pi 상태를 읽고 있어요</small></div></div>
  </header>

  <section class="telemetry" aria-label="실시간 상태">
    <div><span>주소</span><strong id="address">—</strong></div>
    <div><span>컨트롤러</span><strong id="controller">—</strong></div>
    <div><span>배터리</span><strong id="battery">—</strong></div>
    <button id="refresh" class="secondary">다시 확인</button>
  </section>
  <div id="notice" class="notice" aria-live="assertive">연결 상태를 확인하고 있어요.</div>

  <section class="grid">
    <article class="card">
      <div class="title"><div><p class="eyebrow">CHASSIS</p><h2>바퀴 제어</h2></div><span>W A S D / 방향키</span></div>
      <div class="drive-pad">
        <button class="motion forward" data-direction="forward">↑<small>전진</small></button>
        <button class="motion" data-direction="left">←<small>좌 이동</small></button>
        <button class="motion" data-direction="backward">↓<small>후진</small></button>
        <button class="motion" data-direction="right">→<small>우 이동</small></button>
        <button class="motion compact" data-direction="rotate-left">↺<small>좌 회전</small></button>
        <button class="motion compact" data-direction="rotate-right">↻<small>우 회전</small></button>
      </div>
      <div class="two-controls">
        <label>속도 <strong id="speed-value">35</strong><input id="speed" type="range" min="31" max="40" value="35"></label>
        <label>시간 <strong><span id="drive-duration-value">0.3</span>초</strong><input id="drive-duration" type="range" min="0.05" max="2" step="0.05" value="0.3"></label>
      </div>
      <button id="stop" class="stop">■ 즉시 정지 <kbd>Space</kbd></button>
      <p class="hint">주행 명령은 설정 시간 뒤 Pi에서 자동 정지해요.</p>
    </article>

    <article class="card">
      <div class="title"><div><p class="eyebrow">ARM</p><h2>팔 PWM 제어</h2></div><span>피드백 없는 직접 제어</span></div>
      <label class="select-row">서보<select id="servo"><option>1</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
      <label class="slider">목표 펄스 <strong><span id="pulse-value">1500</span> µs</strong><input id="pulse" type="range" min="500" max="2500" step="10" value="1500"></label>
      <label class="slider">이동 시간 <strong><span id="arm-duration-value">0.5</span>초</strong><input id="arm-duration" type="range" min="0.1" max="3" step="0.1" value="0.5"></label>
      <div class="presets"><button class="secondary preset" data-pulse="1000">1000</button><button class="secondary preset" data-pulse="1500">중앙 1500</button><button class="secondary preset" data-pulse="2000">2000</button></div>
      <button id="move-servo" class="primary">선택한 서보 이동</button>
      <p class="hint warning">처음에는 팔 주변을 비우고 100 µs씩 작게 조정하세요.</p>
    </article>
  </section>

  <section class="card log-card">
    <div class="title"><div><p class="eyebrow">EVIDENCE</p><h2>명령 및 상태 로그</h2></div><span id="last-updated">—</span></div>
    <ol id="events"><li>대시보드가 시작됐어요.</li></ol>
  </section>
</main>
<script src="/app.js" defer></script>
</body>
</html>
