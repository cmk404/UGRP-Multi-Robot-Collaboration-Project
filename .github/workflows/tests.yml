name: Offline regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tensorboard-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-observability.txt
      - name: Install optional TensorBoard tooling
        run: python -m pip install -r requirements-observability.txt pytest==9.1.1
      - name: Verify event readback and local original-video serving
        run: python -m pytest -q tests/test_tensorboard_export.py tests/test_offline_audit_export.py

  reference-act-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-reference-act.txt
      - name: Install optional upstream ACT on CPU
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-reference-act.txt
          python -m pip check
          python scripts/patch_reference_act.py
      - name: Verify real RGB inference, backward, checkpoint, and subprocess boundary
        run: python -m pytest -q tests/test_reference_approach_data.py tests/test_reference_act_optional.py tests/test_act_training_optional.py tests/test_recovery_act_optional.py tests/test_pair_carry_act_optional.py tests/test_pair_carry_input_optional.py tests/test_carry_training_checkpoint_optional.py tests/test_act_deployed_window_cache_optional.py

  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Verify current RGB execution bundle and source pins
        run: python -m harness.rgb_execution_bundle verify-current --id rgb-standard-dispatch-v61

      - name: Reject changes or removal of existing RGB execution bundles
        if: github.event_name == 'pull_request'
        run: python -m harness.rgb_execution_bundle verify-registry --base "${{ github.event.pull_request.base.sha }}"

      - name: Run offline regression suite
        run: python scripts/run_ci_tests.py

      - name: Exercise the task-stage JSON contract with fixture robot ports
        run: python scripts/demo_task_stage_sync.py --output outputs/task-stage-sync-ci

      - name: Exercise the standard workflow manager with an offline fixture
        run: python -m scripts.sim_cli workflow run stage-sync --record outputs/managed-stage-sync-ci --timeout 60

      - name: Exercise variable-cargo mission protocol fixtures
        run: python scripts/prepare_multi_object_pilot.py --output outputs/multi-object-pilot-ci

      - name: Keep variable-cargo protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-object-protocol
          path: outputs/multi-object-pilot-ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep task-stage protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-stage-sync-protocol
          path: outputs/task-stage-sync-ci/
          if-no-files-found: warn
          retention-days: 14

  ubuntu-simulation-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MUJOCO_GL: osmesa
      UGRP_SESSION_DIR: ${{ github.workspace }}/outputs/.quickstart-sessions-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-sim.txt
            requirements-test.txt

      - name: Install Ubuntu rendering and recording tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6 libgl1 libglfw3 xvfb xauth ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -encoders | grep libx264

      - name: Install simulator dependencies
        run: |
          python -m pip install -r requirements-sim.txt -r requirements-test.txt
          python -m pip check

      - name: Check demo input and output boundaries
        run: python -m pytest -q tests/test_sim_quickstart.py tests/test_simulation_recovery_optional.py

      - name: Preserve dispatch and ACT scene physics across standard and research adapters
        run: python -m pytest -q tests/test_dispatch_scene_parity.py

      - name: Verify asynchronous RGB, physics parity, observer isolation, and recording
        run: python -m pytest -q tests/test_dispatch_realtime.py tests/test_dispatch_async_video.py tests/test_dispatch_native_process.py tests/test_snapshot_render.py tests/test_physics_drive_kernel.py tests/test_contact_audit_kernel.py tests/test_zone_landmarks_sim.py

      - name: Keep the native window open after reset and invalid physics
        run: MUJOCO_GL=glfw xvfb-run -a python scripts/ugrp_session.py run native-recovery-ci -- python -m scripts.check_simulation_recovery --output outputs/simulation-ci/recovery

      - name: Verify low-level reset, commands, RGB and scene configuration
        run: python -m scripts.check_simulation --output outputs/simulation-ci/api

      - name: Run the native MuJoCo window on a virtual desktop
        run: |
          for attempt in 1 2 3; do
            MUJOCO_GL=glfw xvfb-run -a python scripts/ugrp_session.py run native-ci -- python -m scripts.sim_cli run configs/simulation/drive.json --sim-seconds 3 --wall-seconds 60 --output "outputs/simulation-ci/native-$attempt"
            test ! -e "$UGRP_SESSION_DIR/native-ci.json"
          done
          python -c "import json,pathlib; rows=[json.loads(p.read_text()) for p in pathlib.Path('outputs/simulation-ci').glob('native-*/result.json')]; assert len(rows)==3 and all(r['protocol_complete'] and r['commands']==3 for r in rows), rows"

      - name: Extend a copied scene, action and controller without core edits
        run: |
          python scripts/ugrp_session.py run extensions-ci -- python -m scripts.check_simulation_extensions --output outputs/simulation-ci/extensions
          UGRP_SIM_PYTHON="$(command -v python)" MUJOCO_GL=glfw xvfb-run -a bash scripts/open_simulation.command run examples/simulation_extensions/config.json --wall-seconds 60 --output outputs/simulation-ci/extensions-native
          python -c "import json; r=json.load(open('outputs/simulation-ci/extensions-native/result.json')); assert r['protocol_complete'] and r['controller_calls']==10, r"

      - name: Preserve every research scene and record the native default
        run: |
          python scripts/ugrp_session.py run scenes-ci -- python -m scripts.check_simulation_scenes --output outputs/simulation-ci/research-scenes
          MUJOCO_GL=glfw xvfb-run -a python scripts/ugrp_session.py run research-native -- python -m scripts.sim_cli run configs/simulation/local.json --sim-seconds 1 --wall-seconds 90 --video --capture --output outputs/simulation-ci/research-native
          python -c "import json; r=json.load(open('outputs/simulation-ci/research-native/result.json')); assert r['protocol_complete'] and r['video']['frames'] >= 10, r"
          ffprobe -v error -show_entries stream=width,height,nb_frames -of json outputs/simulation-ci/research-native/motion.mp4

      - name: Exercise terminal commands in the native console
        run: |
          MUJOCO_GL=glfw xvfb-run -a python scripts/ugrp_session.py run console-ci -- python -m scripts.sim_cli console configs/simulation/local.json --mode manual --task 'r1 앞으로 0.5초' --exit-after-task --wall-seconds 60 --output outputs/simulation-ci/console
          python -c "import json; r=json.load(open('outputs/simulation-ci/console/result.json')); assert r['operator_session_complete'] and r['commands']==1 and r['model_calls']==0 and not r['console_errors'], r"

      - name: Verify existing plan wiring and isolated native dispatch observer
        run: |
          python -m pytest -q tests/test_simulation_dispatch.py
          UGRP_TEST_NATIVE_VIEWER=1 MUJOCO_GL=glfw xvfb-run -a python scripts/ugrp_session.py run dispatch-view-ci -- python -m pytest -q tests/test_simulation_dispatch.py::test_real_native_observer_lifecycle
          python -m pytest -q tests/test_dispatch_replay.py
          UGRP_TEST_NATIVE_VIEWER=1 MUJOCO_GL=glfw xvfb-run -a python scripts/ugrp_session.py run dispatch-replay-ci -- python -m pytest -q tests/test_dispatch_replay.py::test_real_native_replay_window_reaches_the_last_frame

      - name: Keep simulator verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-runtime-verification
          path: outputs/simulation-ci/
          if-no-files-found: warn
          retention-days: 14

  ubuntu-simulation-scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MUJOCO_GL: osmesa
      UGRP_SESSION_DIR: ${{ github.workspace }}/outputs/.quickstart-sessions-scenarios
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-sim.txt
            requirements-test.txt

      - name: Install Ubuntu rendering and recording tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6 libgl1 libglfw3 xvfb xauth ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -encoders | grep libx264

      - name: Install simulator dependencies
        run: |
          python -m pip install -r requirements-sim.txt -r requirements-test.txt
          python -m pip check

      - name: Render and move without a model or GPU
        run: |
          python scripts/run_colab_simulation.py --output outputs/colab-quickstart-ci -- python -m scripts.sim_quickstart --output '{output}'
          test ! -e "$UGRP_SESSION_DIR/colab-colab-quickstart-ci.json"
          python -c "import json; r=json.load(open('outputs/colab-quickstart-ci/result/summary.json')); assert r['ok'] and r['frame_count'] == 12, r"
          cd outputs && sha256sum -c colab-quickstart-ci.zip.sha256

      - name: Two unloaded robots yield using RGB and clear reservations
        run: |
          python scripts/ugrp_session.py run rgb-traffic-ci -- python -m scripts.run_rgb_traffic --scenario crossing --out-dir outputs/rgb-traffic-ci
          python -m scripts.audit_rgb_traffic outputs/rgb-traffic-ci
          python -c "import json; r=json.load(open('outputs/rgb-traffic-ci/result.json')); assert r['error'] is None and r['evaluation']['success'], r"
          test ! -e "$UGRP_SESSION_DIR/rgb-traffic-ci.json"

      - name: Keep demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-quickstart
          path: |
            outputs/colab-quickstart-ci/
            outputs/colab-quickstart-ci.zip*
          if-no-files-found: warn
          retention-days: 14

      - name: Exercise stage revocation and resume on real simulation ports
        run: |
          python scripts/ugrp_session.py run stage-execution -- python scripts/probe_task_stage_execution.py --output outputs/stage-execution-ci
          test ! -e "$UGRP_SESSION_DIR/stage-execution.json"

      - name: Keep stage execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-stage-execution-physics
          path: outputs/stage-execution-ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Inspect the shared dispatch arena without a model
        run: |
          python scripts/ugrp_session.py run dispatch-arena -- python scripts/run_research_dispatch.py --output outputs/dispatch-arena-ci --variant north_blocked --planner fixture --motion-smoke
          test ! -e "$UGRP_SESSION_DIR/dispatch-arena.json"

      - name: Keep dispatch arena evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-arena-physics
          path: outputs/dispatch-arena-ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep RGB traffic smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-rgb-traffic
          path: outputs/rgb-traffic-ci/
          if-no-files-found: warn
          retention-days: 14

  multi-object-scenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MUJOCO_GL: osmesa
      UGRP_SESSION_DIR: ${{ github.workspace }}/outputs/.multi-object-sessions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-sim.txt
            requirements-test.txt
      - name: Install simulator and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6 libgl1 libglfw3 fonts-noto-cjk
          python -m pip install -r requirements-sim.txt -r requirements-test.txt
      - name: Check physical replicas and geometry regressions
        run: python -m pytest -q tests/test_multi_object_scene.py tests/test_multi_object_execution.py
      - name: Render all twelve static multi-object scenes
        run: |
          python scripts/ugrp_session.py run multi-object-scenes -- python scripts/prepare_multi_object_scenes.py --render --require-static-candidates --output outputs/multi-object-scenes-ci
          test ! -e "$UGRP_SESSION_DIR/multi-object-scenes.json"
      - name: Bind all cargo from RGB only
        run: python scripts/audit_multi_object_rgb.py --input outputs/multi-object-scenes-ci --output outputs/multi-object-scenes-ci/rgb-binding-audit.json
      - name: Keep static scene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-object-static-scenes
          path: outputs/multi-object-scenes-ci/
          if-no-files-found: warn
          retention-days: 14

  individual-proxy-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check personal proxy installation without Google credentials
        run: bash scripts/smoke_gemini_proxy.sh
